# verdict values:
#   human_right         adjudicated FALSE -- raising it again is a regression
#   bot_right           adjudicated TRUE  -- failing to raise it is a miss
#   bot_right_trivial   true but not worth saying -- neutral, counted as noise
items:
  - id: mr41-no-action-flag
    project_path: acme-security-exchange-key-sec/acme-security-exchange
    mr_iid: 41
    file: acme/integrations/threat_intel/models/business_rule.py
    line: 185
    verdict: human_right
    claim: "Breaking validation change: existing 'No Action' rules become invalid"
    why: CTE_NO_ACTION_VALUE is introduced in this same commit, so no pre-existing rule could hold it.

  - id: mr41-threat_intel-ticket_sync-import
    project_path: acme-security-exchange-key-sec/acme-security-exchange
    mr_iid: 41
    file: acme/integrations/threat_intel/tasks/share_indicators.py
    line: 29
    verdict: bot_right_trivial
    claim: New hard cross-module dependency threat_intel to ticket_sync
    why: Real, but threat_intel already couples to CRE and all integrations load in one Celery app.

  - id: mr41-field-autoregistration
    project_path: acme-security-exchange-key-sec/acme-security-exchange
    mr_iid: 41
    file: acme/integrations/service_desk/tasks/pull_data_items.py
    line: 383
    verdict: bot_right_trivial
    claim: ticket_sync field auto-registration causes field proliferation
    why: Reuses the pre-existing upsert-by-name helper, capped by a seen-set, and is the function's documented purpose.

  - id: mr60-creshare-omission
    project_path: acme-security-exchange-key-sec/acme-security-exchange
    mr_iid: 60
    file: acme/integrations/threat_intel/models/business_rule.py
    line: 298
    verdict: bot_right_trivial
    claim: validate_sharedWith omits the current rule's existing creShare fields
    why: validate_creShare enforces strict mutual exclusion, so a rule can never hold both.

  - id: mr60-test-fixture-mongo
    project_path: acme-security-exchange-key-sec/acme-security-exchange
    mr_iid: 60
    file: tests/api/integrations/threat_intel/test_sharing_configuration.py
    line: 22
    verdict: human_right
    claim: Test fixture mutates a shared MongoDB settings collection
    why: Pure MagicMock with connector and helper patched, and the line is pre-existing code the diff never touches.

  - id: mr53-pipestatus
    project_path: acme-security-exchange-key-sec/acme-security-exchange-ui
    mr_iid: 53
    file: .gitlab-ci.yml
    line: 115
    verdict: human_right
    claim: PIPESTATUS is bash-specific and fails on /bin/sh runners
    why: build_ui is a Shell-executor job (tags shell/new_shell, no image), which defaults to bash.

  - id: mr49-enforcefocus
    project_path: acme-security-exchange-key-sec/acme-security-exchange-ui
    mr_iid: 49
    file: src/components/Integrations/Settings/Components/PluginRepo/UpdateConfiguration.jsx
    line: 55
    verdict: human_right
    claim: Modal focus trap disabled, accessibility regression
    why: enforceFocus={false} appears in 24 other modals; it is the app's established nested-modal workaround.

  - id: mr32-generatealert-default
    project_path: acme-security-exchange-key-sec/acme-security-exchange-ui
    mr_iid: 32
    file: src/components/Sharing/SharingForm.jsx
    line: 126
    verdict: human_right
    claim: Wrong default for generateAlert when editing an existing config
    why: >
      Action.generateAlert defaults to False for legacy actions; the Field(True)
      it cited is a different global-only default. Its suggested fix would have
      switched alerts on for every legacy rule.

  - id: mr61-db-in-validator
    project_path: acme-security-exchange-key-sec/acme-security-exchange
    mr_iid: 61
    file: acme/integrations/rules_v2/models/business_rules.py
    line: 210
    verdict: human_right
    claim: "Layering violation: database query inside a model validator"
    why: 50+ find_one calls inside validators across six modules; it is the codebase's universal pattern.

  - id: mr12-shell-injection
    project_path: acme-security-exchange-key-sec/acme-security-exchange-docker-compose
    mr_iid: 12
    file: ce_healthcheck
    line: 1763
    verdict: bot_right
    claim: file_contains and ha_peer_ports silently PASS when a pass/fail pattern is absent
    why: >
      Human confirmed and fixed it, calling the analysis accurate throughout.
      The only bot_right item currently in the set, so recall is measured on a
      single example -- treat a recall figure as directional, not precise.
