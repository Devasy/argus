# Manual relevance gold standard for learning retrieval, judged 2026-09-09.
#
# Why this exists: retrieval quality could only be scored against outcome
# labels (12 `hit` events in ~9,200 injections), which the review-quality
# ledger already called too sparse to read -- AUC 0.564, indistinguishable
# from chance. This file replaces that with a direct judgement: for each
# benchmark MR, which learnings in the candidate pool a competent reviewer
# would actually want in front of them.
#
# Judging rule, applied per (MR, learning) pair against the MR's real diff:
#   strong -- bears on something this diff actually does, and holding it in
#             mind would plausibly change a verdict (catch a real defect, or
#             correctly refrain from raising a false one).
#   weak   -- same subsystem or technology and plausibly applicable, but does
#             not bear on anything the diff specifically does.
# Everything else in the pool is unjudged and counts as not relevant.
#
# `strong` is the scoring target. `weak` is recorded so a change that trades
# a weak hit for a strong one is visible rather than looking like noise.
#
# Pools are the active kind="guidance" learnings that existed for that repo
# at 2026-09-09 05:39 UTC (the first scored run): 24 for docker-compose, 54
# for -ui, 132 for acme-security-exchange. There were no global
# (repo_id IS NULL) guidance learnings at that time.
#
# Ids are 8-char prefixes, the same form the agent sees and cites.

