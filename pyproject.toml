[project]
name = "argus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "litellm>=1.55",
    "pgvector>=0.3.6",
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-litellm>=0.1",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "graphifyy>=0.9.2",
    "pyyaml>=6.0.3",
    "langfuse>=2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.26.0", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]
